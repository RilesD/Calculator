<!DOCTYPE.HTML>
<html>
  <head>
    <title>Simple Calculator</title>
    <style>
      html, body {
        background-color: #000000;
        color: #ffffff;
        text-align: center;
        min-height: 100vh;
      }
        </style>
    <script>

         function add() {
           let a=document.getElementById("num1").value;
           let b=document.getElementById("num2").value;
           let c = Number(a) + Number(b);
           document.getElementById("rslt").innerHTML=c;

         }

               function sub() {
           let a=document.getElementById("num1").value;
           let b=document.getElementById("num2").value;
           let c = Number(a) - Number(b);
           document.getElementById("rslt").innerHTML=c;

         }
               
               function mult() {
           let a=document.getElementById("num1").value;
           let b=document.getElementById("num2").value;
           let c = Number(a) * Number(b);
           document.getElementById("rslt").innerHTML=c;

         }
               function div() {
           let a=document.getElementById("num1").value;
           let b=document.getElementById("num2").value;
           let c = Number(a) / Number(b);
           document.getElementById("rslt").innerHTML=c;

         }
      
    </script>
  </head>
  <body>
    <br>
    <h2>My JavaScript Powered Multiple Function Calculator</h2>
    <p>Value 1<input id="num1" style="width: 120px;">
      <br>
      Value 2<input id="num2" style="width: 120px;">
      <br>
    <button onclick="add()">Add</button>
    <button onclick="sub()">Subtract</button>
    <button onclick="mult()">Multiply</button>
    <button onclick="div()">Divide</button>
    
    </p>
    <p>
      Result: <span id="rslt"></span>
    </p>
 
  </body>
</html>
